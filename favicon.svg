<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with brutalist frame -->
  <rect width="512" height="512" fill="#FFE600" />
  <rect x="24" y="24" width="464" height="464" rx="0" fill="#FFFDF8" stroke="#141414" stroke-width="24" />
  
  <!-- Shadow of inner square -->
  <rect x="120" y="120" width="280" height="280" fill="#141414" />
  <!-- Inner card -->
  <rect x="104" y="104" width="280" height="280" fill="#FF4522" stroke="#141414" stroke-width="20" />
  
  <!-- Checkmark / Dice / Stamp style mark -->
  <!-- Checkmark in lime acido -->
  <path d="M160 240 L224 304 L340 168" fill="none" stroke="#B8FF2C" stroke-width="36" stroke-linecap="square" stroke-linejoin="miter" />
  <!-- Secondary dice pip -->
  <circle cx="170" cy="160" r="16" fill="#141414" />
  <circle cx="320" cy="320" r="16" fill="#141414" />
</svg>
